# CareerOS Production Application Stack
# ==============================================================================
# Usage:
#   docker compose build
#   docker compose up -d
#
# Prerequisites:
#   Configure MONGODB_URI and JWT_SECRET in server/.env or export them before running:
#   export MONGODB_URI="mongodb+srv://user:pass@cluster.mongodb.net/careeros"
#   export JWT_SECRET="your_secure_production_secret_32_chars_min"
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend HTTP API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: careeros-api
    restart: unless-stopped
    # Expose internally to the Docker bridge network; no public host mapping
    # All client traffic flows through Frontend/Nginx reverse proxy to prevent TRUST_PROXY spoofing
    expose:
      - "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_URL=${APP_CLIENT_URL:-http://localhost:3000}
      - TRUST_PROXY=1
      - MONGODB_URI=${DOCKER_MONGODB_URI:-${MONGODB_URI}}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN:-15m}
      - REFRESH_TOKEN_EXPIRES_IN_DAYS=${REFRESH_TOKEN_EXPIRES_IN_DAYS:-7}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME:-careeros_refresh_token}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-1000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-100}
      - AUTH_RATE_LIMIT_WINDOW_MS=${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      - DB_MAX_RETRIES=${DB_MAX_RETRIES:-5}
      - DB_INITIAL_DELAY_MS=${DB_INITIAL_DELAY_MS:-1000}
      - DB_MAX_DELAY_MS=${DB_MAX_DELAY_MS:-10000}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-6000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Frontend Static SPA & Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: careeros-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - api

  # ----------------------------------------------------------------------------
  # Calendar Reminder Background Worker
  # ----------------------------------------------------------------------------
  reminder-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: careeros-reminder-worker
    restart: unless-stopped
    command: ["node", "src/workers/reminder.worker.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_URL=${APP_CLIENT_URL:-http://localhost:3000}
      - MONGODB_URI=${DOCKER_MONGODB_URI:-${MONGODB_URI}}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - REMINDER_POLL_INTERVAL_MS=${REMINDER_POLL_INTERVAL_MS:-60000}
      - DB_MAX_RETRIES=${DB_MAX_RETRIES:-5}
      - DB_INITIAL_DELAY_MS=${DB_INITIAL_DELAY_MS:-1000}
      - DB_MAX_DELAY_MS=${DB_MAX_DELAY_MS:-10000}
    depends_on:
      - api

  # ----------------------------------------------------------------------------
  # Opportunity Ingestion Background Worker
  # ----------------------------------------------------------------------------
  ingestion-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: careeros-ingestion-worker
    restart: unless-stopped
    command: ["node", "src/workers/ingestion.worker.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_URL=${APP_CLIENT_URL:-http://localhost:3000}
      - MONGODB_URI=${DOCKER_MONGODB_URI:-${MONGODB_URI}}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - INGESTION_INTERVAL_MINUTES=${INGESTION_INTERVAL_MINUTES:-60}
      - DB_MAX_RETRIES=${DB_MAX_RETRIES:-5}
      - DB_INITIAL_DELAY_MS=${DB_INITIAL_DELAY_MS:-1000}
      - DB_MAX_DELAY_MS=${DB_MAX_DELAY_MS:-10000}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
    depends_on:
      - api
